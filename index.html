<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10"><link rel="manifest" href="manifest.webmanifest"><title>MONSTER DIVE II</title>
<style>
:root{--bg:#0b0c10;--p:#15171d;--p2:#1e212a;--line:#30343f;--txt:#f5f5ef;--muted:#969aa8;--lime:#d9ff62;--red:#ff6675;--gold:#ffd66b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#303546,#0b0c10 48%);color:var(--txt);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer}.app{max-width:540px;margin:auto;padding:15px 13px 35px}
header{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:950;letter-spacing:.13em}.sub{font-size:9px;color:var(--muted);letter-spacing:.16em}.currency{background:#171920;border:1px solid var(--line);padding:8px 11px;border-radius:12px;font-size:12px}
.screen{display:none}.screen.active{display:block}.card{background:linear-gradient(145deg,#191b22,#121319);border:1px solid var(--line);border-radius:20px;padding:15px;margin:10px 0;box-shadow:0 12px 35px #0006}
.hero{text-align:center}.floor{font-size:10px;color:var(--muted);letter-spacing:.15em}.tag{font-size:11px;color:var(--muted)}.monster{height:165px;display:flex;align-items:center;justify-content:center;position:relative}.monster .body{font-size:100px;filter:drop-shadow(0 13px 9px #0008)}.monster .acc{position:absolute;font-size:36px;transform:translate(45px,-48px)}.monster .mark{position:absolute;font-size:22px;transform:translate(-48px,-45px)}.name{font-size:23px;font-weight:900}.species{font-size:10px;color:var(--muted);letter-spacing:.08em}.bar{height:10px;background:#090a0d;border:1px solid #292c35;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#9bdc46,#d9ff62);transition:.2s}.enemyfill{background:linear-gradient(90deg,#ff4f66,#ff9570)}.hpbox{margin:12px 7px}.hptext{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.stat{background:#101116;border:1px solid var(--line);border-radius:12px;text-align:center;padding:7px 3px}.stat b{display:block;font-size:15px}.stat small{color:var(--muted);font-size:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{background:#252832;border:1px solid #383c48;border-radius:14px;padding:12px;font-weight:800}.btn.primary{background:var(--lime);color:#11150c;border-color:var(--lime)}.btn:disabled{opacity:.35}
.section{font-size:10px;color:var(--muted);letter-spacing:.14em;margin:18px 2px 7px}.nodes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.node{background:#181a21;border:1px solid var(--line);border-radius:16px;padding:11px 7px;text-align:left;min-height:110px}.node .ico{font-size:25px}.node b{display:block;margin:6px 0 2px}.node small{font-size:9px;color:var(--muted)}
.log{max-height:145px;overflow:auto;font-size:10px;color:#c9cbd3;line-height:1.55}.log div{padding:4px 0;border-bottom:1px solid #252832}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mon.selected{background:#252b20}.mon{background:#14161c;border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}.mon .mini{font-size:50px}.mon b{font-size:13px}.mon small{font-size:9px;color:var(--muted)}.locked{filter:grayscale(1);opacity:.35}
.rarity{font-size:9px;font-weight:900;letter-spacing:.08em}.common{border-color:#555b67}.uncommon{border-color:#5ec99a}.rare{border-color:#66a5ff}.epic{border-color:#bd76ff}.legendary{border-color:#ffd45e}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{width:100%;max-width:540px;margin:auto;background:#171920;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:17px;max-height:90vh;overflow:auto}.close{float:right;width:32px;height:32px;border-radius:50%;background:#2a2d36}.choicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice{background:#232630;border:1px solid var(--line);border-radius:13px;padding:9px;text-align:center}.choice.selected{outline:2px solid var(--lime)}.choice span{display:block;font-size:25px}.choice small{font-size:8px;color:var(--muted)}
.notice{background:#20231a;border:1px solid #4d572e;border-radius:13px;padding:10px;font-size:10px;color:#dce7b1}.boss{border-color:#70404a}.danger{color:#ff8994}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body><div class="app">
<header><div><div class="logo">MONSTER DIVE II</div><div class="sub">COLLECT / EVOLVE / BUILD</div></div><div class="currency">✦ <span id="shards">0</span></div></header>

<section id="home" class="screen active"><div class="card hero">
<div class="floor">ACTIVE PARTNER</div><div id="homeVisual" class="monster"></div><div id="homeName" class="name"></div><div id="homeSpecies" class="species"></div>
<div class="hpbox"><div class="bar"><div id="homeHp" class="fill" style="width:100%"></div></div><div class="hptext"><span id="homeHpText"></span><span id="homeXP"></span></div></div>
<div id="homeStats" class="stats"></div><div class="actions"><button class="btn primary" onclick="startRun()">⚔ START DIVE</button><button class="btn" onclick="customize()">✦ CUSTOMIZE</button></div></div>
<div class="section">BESTIARY</div><div class="card"><div id="preview" class="grid2"></div><button class="btn" style="width:100%;margin-top:8px" onclick="collection()">VIEW ALL MONSTERS</button></div>
<div class="section">PERMANENT RELICS</div><div class="card" id="relics"></div></section>

<section id="map" class="screen"><div class="card"><div class="floor" id="floorTitle"></div><h2 style="margin:4px 0">Choose your path</h2><div class="tag">The deeper you go, the stranger it gets.</div></div><div id="nodes" class="nodes"></div><div class="card"><div class="section" style="margin-top:0">RUN STATUS</div><div id="runStats" class="stats"></div></div><button class="btn" style="width:100%" onclick="relicModal()">✦ RUN RELICS</button></section>

<section id="battle" class="screen"><div class="card"><div class="floor" id="battleTitle"></div><div id="enemyName" style="text-align:center;font-weight:900;font-size:18px"></div><div id="enemyVisual" class="monster" style="height:105px"></div><div class="hpbox"><div class="bar"><div id="enemyHP" class="fill enemyfill"></div></div><div class="hptext"><span id="enemyHPText"></span><span id="intent"></span></div></div>
<div id="playerVisual" class="monster" style="height:100px"></div><div id="playerName" style="text-align:center;font-weight:900"></div><div class="hpbox"><div class="bar"><div id="playerHP" class="fill"></div></div><div class="hptext"><span id="playerHPText"></span><span id="battleXP"></span></div></div>
<div class="actions"><button class="btn primary" onclick="attack()">⚔ ATTACK</button><button class="btn" onclick="skill()">✦ SKILL</button><button class="btn" id="captureBtn" onclick="capture()">◉ CAPTURE</button><button class="btn" onclick="escapeBattle()">↩ ESCAPE</button></div><div class="section">BATTLE LOG</div><div id="battleLog" class="log"></div></div></section>

<section id="event" class="screen"><div class="card hero"><div id="eventIcon" style="font-size:55px"></div><h2 id="eventTitle"></h2><p id="eventText" class="tag" style="line-height:1.8"></p><div id="eventBtns" class="actions"></div></div></section>
<section id="boss" class="screen"><div class="card hero boss"><div class="floor">FLOOR BOSS</div><div id="bossVisual" class="monster"></div><div id="bossName" class="name"></div><p class="tag">A boss relic awaits.</p><button class="btn primary" style="width:100%" onclick="startBoss()">⚔ BOSS BATTLE</button></div></section>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
</div>

<script>
const M={
slime:{species:"SLIME",base:"🟢",name:"Mochi",hp:48,atk:9,def:3,skill:"Split Shot",evo:[["Aqua Mochi","🫧",{hp:16,atk:4,def:1}],["King Mochi","👑",{hp:30,atk:7,def:3}]]},
fox:{species:"FOX",base:"🦊",name:"Kits",hp:42,atk:11,def:2,skill:"Flame Bite",evo:[["Ember Kits","🔥",{hp:12,atk:7,def:1}],["Nox Kits","🌙",{hp:24,atk:9,def:2}]]},
bat:{species:"BAT",base:"🦇",name:"Bibi",hp:38,atk:12,def:2,skill:"Sonic",evo:[["Voltwing","⚡",{hp:15,atk:6,def:2}],["Nightwing","🪽",{hp:22,atk:10,def:2}]]},
plant:{species:"PLANT",base:"🌱",name:"Moss",hp:55,atk:7,def:5,skill:"Vine Heal",evo:[["Bloom","🌸",{hp:20,atk:4,def:3}],["Ancient Bloom","🌳",{hp:35,atk:7,def:5}]]},
golem:{species:"GOLEM",base:"🗿",name:"Roku",hp:68,atk:8,def:7,skill:"Stone Guard",evo:[["Iron Roku","🤖",{hp:24,atk:5,def:4}],["Titan Roku","🗿",{hp:45,atk:8,def:6}]]},
ghost:{species:"GHOST",base:"👻",name:"Muu",hp:40,atk:13,def:1,skill:"Curse",evo:[["Wisp","💠",{hp:13,atk:8,def:2}],["Phantom","👾",{hp:25,atk:12,def:3}]]},
};
const EN=[
["slime","Wild Slime","🟢",30,7,1],["fox","Cinder Fox","🦊",34,8,1],["bat","Cave Bat","🦇",28,10,1],["plant","Mossling","🌱",42,6,3],["golem","Pebble Golem","🗿",55,7,5],["ghost","Lost Wisp","👻",36,11,2]
];
const REL=[
["Lucky Fang","UNCOMMON","CRIT +8%"],["Moon Feather","RARE","DODGE +8%"],["Void Core","EPIC","ATK +5"],["Ancient Bell","LEGENDARY","CAPTURE +15%"],["Tiny Shield","COMMON","DEF +2"],["Greedy Coin","RARE","GOLD x1.5"],["Second Heart","LEGENDARY","SURVIVE ONCE"]
];
let S=JSON.parse(localStorage.getItem("MD2")||"null")||{shards:20,owned:["slime"],active:"slime",mons:{slime:{lv:1,xp:0,rare:false,custom:{acc:"",mark:"✦"}}},relics:[],best:0};
let run=null,B=null,choices=[];
const save=()=>localStorage.setItem("MD3",JSON.stringify(S));
function md(id){let b=M[id],x=S.mons[id]||{lv:1,xp:0,rare:false,custom:{}};let hp=b.hp,atk=b.atk,def=b.def,body=b.base,name=b.name;if(x.lv>=9){let e=b.evo[1];name=e[0];body=e[1];hp+=e[2].hp;atk+=e[2].atk;def+=e[2].def}else if(x.lv>=5){let e=b.evo[0];name=e[0];body=e[1];hp+=e[2].hp;atk+=e[2].atk;def+=e[2].def}if(x.rare){body="🌈";name="Shiny "+name}return {...b,...x,hp,atk,def,body,name}};
function xpNeed(l){return 12+l*8}
function vis(id,extra=""){let x=md(id);return `<span class="body">${x.body}</span><span class="acc">${x.custom?.acc||""}</span><span class="mark">${x.custom?.mark||extra}</span>`}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active")}
function render(){let x=md(S.active);document.getElementById("shards").textContent=S.shards;document.getElementById("homeVisual").innerHTML=vis(S.active);document.getElementById("homeName").textContent=x.name;document.getElementById("homeSpecies").textContent=`${x.species} • ${x.rare?"✨ SHINY • ":""}Lv.${x.lv}`;
document.getElementById("homeHpText").textContent=`HP ${x.hp}/${x.hp}`;document.getElementById("homeXP").textContent=`XP ${x.xp}/${xpNeed(x.lv)}`;document.getElementById("homeStats").innerHTML=[["ATK",x.atk],["DEF",x.def],["HP",x.hp],["CRIT",(8+(S.relics.includes("Lucky Fang")?8:0))+"%"]].map(a=>`<div class="stat"><b>${a[1]}</b><small>${a[0]}</small></div>`).join("");
document.getElementById("preview").innerHTML=S.owned.slice(0,4).map(id=>{let z=md(id);return `<div class="mon"><div class="mini">${z.body}</div><b>${z.name}</b><br><small>Lv.${z.lv} • ${z.species}</small></div>`}).join("");
document.getElementById("relics").innerHTML=S.relics.length?S.relics.map(r=>`<div class="item" style="padding:7px;border-bottom:1px solid #292c35"><b>✦ ${r}</b></div>`).join(""):"<span class='tag'>No permanent relics yet.</span>";save()}
function startRun(){let x=md(S.active);run={floor:1,hp:x.hp,maxHp:x.hp,gold:0,runRelics:[],captures:0,usedHeart:false};map()}
function map(){document.getElementById("floorTitle").textContent=`FLOOR ${run.floor} / 10`;let a=[["battle","⚔","Battle","Normal enemy"],["treasure","✦","Treasure","Relic chance"],["event","?","Mystery","Risk / reward"]];if(run.floor%3===0)a[2]=["recruit","◉","Recruit","Capture chance"];if(run.floor%5===0)a=[["battle","⚔","ELITE","Rare rewards"],["recruit","◉","HUNT","Monster chance"],["rest","♥","CAMP","Recover 40% HP"]];document.getElementById("nodes").innerHTML=a.map(t=>`<button class="node" onclick="node('${t[0]}')"><div class="ico">${t[1]}</div><b>${t[2]}</b><small>${t[3]}</small></button>`).join("");document.getElementById("runStats").innerHTML=[["HP",`${run.hp}/${run.maxHp}`],["GOLD",run.gold],["FLOOR",run.floor],["CAPTURE",run.captures]].map(a=>`<div class="stat"><b>${a[1]}</b><small>${a[0]}</small></div>`).join("");show("map")}
function node(t){if(t==="battle"){battle(false,false);return}if(t==="recruit"){battle(false,true);return}if(t==="treasure"){treasure();return}if(t==="rest"){run.hp=Math.min(run.maxHp,run.hp+Math.ceil(run.maxHp*.4));next("♥ Camp restored you.");return}event()}
function enemy(elite=false){let q=EN[Math.floor(Math.random()*EN.length)],mult=(1+(run.floor-1)*.1)*(elite?1.7:1);return{id:q[0],name:q[1],body:q[2],hp:Math.round(q[3]*mult),maxHp:Math.round(q[3]*mult),atk:Math.round(q[4]*mult),def:q[5]+(elite?3:0),elite}}
function battle(elite=false,recruit=false){B={e:enemy(elite),recruit,boss:false};document.getElementById("battleLog").innerHTML="";if(recruit)log("◉ Weaken it and attempt a capture.");drawBattle();show("battle")}
function drawBattle(){let e=B.e,x=md(S.active);document.getElementById("battleTitle").textContent=`FLOOR ${run.floor} • ${B.boss?"BOSS":B.recruit?"RECRUIT":e.elite?"ELITE":"BATTLE"}`;document.getElementById("enemyName").textContent=e.name+(e.elite?" ★":"");document.getElementById("enemyVisual").innerHTML=`<span class="body">${e.body}</span>`;document.getElementById("enemyHP").style.width=Math.max(0,e.hp/e.maxHp*100)+"%";document.getElementById("enemyHPText").textContent=`HP ${Math.max(0,e.hp)}/${e.maxHp}`;document.getElementById("intent").textContent=`ATK ${e.atk}`;document.getElementById("playerVisual").innerHTML=vis(S.active);document.getElementById("playerName").textContent=x.name;document.getElementById("playerHP").style.width=Math.max(0,run.hp/run.maxHp*100)+"%";document.getElementById("playerHPText").textContent=`HP ${run.hp}/${run.maxHp}`;document.getElementById("battleXP").textContent=`Lv.${x.lv}`;document.getElementById("captureBtn").disabled=e.hp>e.maxHp*.45}
function log(s){document.getElementById("battleLog").innerHTML=`<div>${s}</div>`+document.getElementById("battleLog").innerHTML}
function hurt(n){let x=md(S.active),d=Math.max(1,n-x.def-(S.relics.includes("Tiny Shield")?2:0));if(S.relics.includes("Moon Feather")&&Math.random()<.08){log("🪽 Dodged!");return}run.hp-=d;log(`💥 Took ${d} damage.`);if(run.hp<=0){if(S.relics.includes("Second Heart")&&!run.usedHeart){run.usedHeart=true;run.hp=1;S.relics=S.relics.filter(r=>r!=="Second Heart");log("♥ SECOND HEART saved the run!")}else{setTimeout(dead,250)}}}
function attack(){let x=md(S.active),crit=Math.random()<.08+(S.relics.includes("Lucky Fang")?.08:0),d=Math.max(1,x.atk+(crit?Math.ceil(x.atk*.7):0)-B.e.def);B.e.hp-=d;log(`${crit?"💥 CRITICAL ":""}Dealt ${d}.`);turn()}
function skill(){let x=md(S.active),d=Math.max(2,Math.round(x.atk*1.7)-B.e.def);B.e.hp-=d;if(x.species==="PLANT")run.hp=Math.min(run.maxHp,run.hp+Math.ceil(run.maxHp*.15));else if(x.species==="GOLEM")run.hp=Math.min(run.maxHp,run.hp+4);else if(x.species==="GHOST")B.e.hp-=Math.ceil(d*.3);log(`✦ ${x.skill}! ${d} damage.`);turn()}
function turn(){if(B.e.hp<=0){win();return}setTimeout(()=>{hurt(B.e.atk);drawBattle()},170);drawBattle()}
function capture(){let e=B.e;if(e.hp>e.maxHp*.45)return;let shiny=Math.random()<.035;let chance=.3+(1-e.hp/e.maxHp)*.45+(S.relics.includes("Ancient Bell")?.15:0);if(Math.random()<chance){if(!S.owned.includes(e.id)){S.owned.push(e.id);S.mons[e.id]={lv:1,xp:0,rare:shiny,custom:{acc:"",mark:"✦"}};log(`✨ CAPTURED ${shiny?"A SHINY ":""}${M[e.id].species}!`)}else{S.shards+=6;log("◉ Duplicate → +6 shards.")}run.captures++;setTimeout(()=>next("◉ Monster captured."),450)}else{log("◉ Capture failed.");hurt(e.atk);drawBattle()}}
function escapeBattle(){if(Math.random()<.75)next("↩ Escaped.");else{log("Couldn't escape.");hurt(B.e.atk);drawBattle()}}
function gain(n){let x=S.mons[S.active];x.xp+=n;while(x.xp>=xpNeed(x.lv)){x.xp-=xpNeed(x.lv);x.lv++;if(x.lv===5||x.lv===9)logGlobal(`Evolution unlocked for ${S.active}`)}render()}
function logGlobal(x){console.log(x)}
function win(){let r=8+(B.e.elite?12:0)+(B.boss?25:0);run.gold+=r;S.shards+=B.e.elite?4:1;gain(B.boss?30:B.e.elite?15:8);if(B.boss){let item=REL[Math.floor(Math.random()*REL.length)];if(!S.relics.includes(item[0]))S.relics.push(item[0]);alert(`BOSS DEFEATED! ✦ ${item[0]} acquired.`)}setTimeout(()=>next(`🏆 Victory! +${r} gold.`),450)}
function treasure(){let item=REL[Math.floor(Math.random()*REL.length)];if(!S.relics.includes(item[0])){S.relics.push(item[0]);run.runRelics.push(item[0]);next(`✦ Found ${item[0]}!`)}else{S.shards+=5;next(`✦ Duplicate relic → +5 shards.`)}render()}
function next(msg){run.floor++;if(run.floor>10){S.shards+=20;S.best=Math.max(S.best,10);render();show("home");alert("DIVE COMPLETE! +20 shards");return}if(run.floor%5===0){boss();return}map()}
function boss(){let q=enemy(true);run.boss=q;document.getElementById("bossVisual").innerHTML=`<span class="body">${q.body}</span>`;document.getElementById("bossName").textContent=q.name+" OVERLORD";show("boss")}
function startBoss(){let e={...run.boss};e.hp*=1.55;e.maxHp=e.hp;e.atk*=1.25;e.name+=" OVERLORD";B={e,recruit:false,boss:true};document.getElementById("battleLog").innerHTML="<div>👑 THE BOSS HAS AWAKENED.</div>";drawBattle();show("battle")}
function event(){let r=Math.floor(Math.random()*3);if(r===0)eventUI("🪞","Mirror Self","The mirror offers a glimpse of an alternate evolution.",[["Touch",()=>{gain(12);next("You learned from your reflection.")}],["Leave",()=>next("You ignored it.")]]);if(r===1)eventUI("🧪","Mutation Juice","Drink it: maximum HP +15, or lose 10 HP.",[["Drink",()=>{if(Math.random()<.65){run.maxHp+=15;run.hp=run.maxHp;next("Your monster mutated positively.")}else{run.hp=Math.max(1,run.hp-10);next("The mutation hurts.")}}],["Leave",()=>next("You left it.")]]);if(r===2)eventUI("🗿","Ancient Shrine","Offer 5 shards for a powerful permanent relic.",[["Offer",()=>{if(S.shards>=5){S.shards-=5;let q=REL[3];if(!S.relics.includes(q[0]))S.relics.push(q[0]);render();next("The shrine gave you an Ancient Bell.")}else alert("Not enough shards.")}],["Leave",()=>next("You walked away.")]])}
function eventUI(i,t,tx,c){choices=c;document.getElementById("eventIcon").textContent=i;document.getElementById("eventTitle").textContent=t;document.getElementById("eventText").textContent=tx;document.getElementById("eventBtns").innerHTML=c.map((x,k)=>`<button class="btn ${k===0?"primary":""}" onclick="choices[${k}][1]()">${x[0]}</button>`).join("");show("event")}
function dead(){S.shards+=Math.floor(run.gold/2);render();show("home");alert("RUN FAILED. Your collection and evolution progress remain.")}

function collection(){document.getElementById("sheet").innerHTML=`<button class="close" onclick="closeM()">×</button><h2>BESTIARY ${S.owned.length}/${Object.keys(M).length}</h2><div class="grid2">${Object.keys(M).map(id=>{let owned=S.owned.includes(id),x=owned?md(id):M[id];return `<button class="mon ${owned?"":"locked"}" onclick="${owned?`select('${id}')`:''}"><div class="mini">${owned?x.body:"?"}</div><b>${owned?x.name:"Unknown"}</b><br><small>${owned?`${x.species} • Lv.${x.lv}${x.rare?" • ✨ SHINY":""}`:"Not discovered"}</small></button>`}).join("")}</div><div class="notice" style="margin-top:10px">Each species has individual XP and evolution. Rare shiny individuals have a different appearance.</div>`;openM()}
function select(id){S.active=id;render();closeM()}
function customize(){let x=S.mons[S.active];document.getElementById("sheet").innerHTML=`<button class="close" onclick="closeM()">×</button><h2>CUSTOMIZE</h2><div id="cprev" class="monster">${vis(S.active)}</div><div class="section">ACCESSORY</div><div class="choicegrid">${["","🎩","👑","🕶️","🎀","⚡","🧢","💎"].map(a=>`<button class="choice ${x.custom.acc===a?"selected":""}" onclick="setc('acc','${a}')"><span>${a||"◯"}</span><small>${a?"equip":"none"}</small></button>`).join("")}</div><div class="section">MARK</div><div class="choicegrid">${["✦","♡","☄","☀","☾","◆"].map(a=>`<button class="choice ${x.custom.mark===a?"selected":""}" onclick="setc('mark','${a}')"><span>${a}</span><small>mark</small></button>`).join("")}</div><div class="notice" style="margin-top:12px">Evolution changes the body while accessories and marks stay with the individual.</div>`;openM()}
function setc(k,v){S.mons[S.active].custom[k]=v;render();customize()}
function relicModal(){document.getElementById("sheet").innerHTML=`<button class="close" onclick="closeM()">×</button><h2>RELICS</h2>${(run?.runRelics?.length?run.runRelics:S.relics).map(r=>{let q=REL.find(a=>a[0]===r);return `<div class="card ${q[1].toLowerCase()}"><b>✦ ${r}</b><div class="tag">${q[1]} • ${q[2]}</div></div>`}).join("")||"<p class='tag'>No relics yet.</p>"}`;openM()}
function openM(){document.getElementById("modal").classList.add("show")}function closeM(){document.getElementById("modal").classList.remove("show")}
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");

/* V3 systems are injected below */
const V3={
  elements:{slime:"WATER",fox:"FIRE",bat:"WIND",plant:"EARTH",golem:"EARTH",ghost:"DARK"},
  skills:{
    slime:[["Bubble Burst","WATER",1.25],["Split","WATER",1.55]],
    fox:[["Flame Fang","FIRE",1.25],["Inferno","FIRE",1.65]],
    bat:[["Sonic Wave","WIND",1.2],["Night Dive","DARK",1.7]],
    plant:[["Vine Whip","EARTH",1.25],["Bloom Heal","EARTH",1.45]],
    golem:[["Rock Crash","EARTH",1.3],["Fortify","EARTH",1.1]],
    ghost:[["Hex","DARK",1.3],["Soul Drain","DARK",1.6]]
  },
  colors:{WATER:"💧",FIRE:"🔥",WIND:"🌪️",EARTH:"🌿",DARK:"🌑"},
  bonus:{WATER:{FIRE:.75},FIRE:{EARTH:1.4},EARTH:{WATER:1.4},WIND:{EARTH:1.15},DARK:{WIND:1.3}}
};

function ensureV3(){
  S.party=S.party||[S.active];
  S.party=[...new Set(S.party.filter(id=>S.owned.includes(id)))].slice(0,3);
  if(!S.party.length)S.party=[S.active];
  S.inventory=S.inventory||{};
  S.ach=S.ach||{};
  S.dungeon=S.dungeon||{runs:0,bosses:0,shiny:0,captures:0};
  S.stones=S.stones||0;
  S.coins=S.coins||0;
}
ensureV3();

function v3Element(id){return V3.elements[id]||"NEUTRAL"}
function v3Mult(a,b){return (V3.bonus[a]&&V3.bonus[a][b])||1}
function getV3Skill(id,index=0){return V3.skills[id]?.[index]||["Tackle","NEUTRAL",1.1]}
function partyStats(id){
  let x=md(id), inv=S.inventory[id]||{};
  return {...x,element:v3Element(id),skill1:v3Skill(id,0),skill2:v3Skill(id,1),
    atk:x.atk+(inv.atk||0),def:x.def+(inv.def||0),hp:x.hp+(inv.hp||0)}
}

function v3HomeButton(){
  if(document.getElementById("partyButton"))return;
  let card=document.querySelector("#home .card.hero");
  let b=document.createElement("button");b.id="partyButton";b.className="btn";b.style.cssText="width:100%;margin-top:8px";
  b.textContent="⚡ PARTY / LOADOUT";b.onclick=partyModal;
  card.appendChild(b);
}
function partyModal(){
  ensureV3();
  document.getElementById("sheet").innerHTML=`<button class="close" onclick="closeM()">×</button>
  <h2>PARTY <small style="color:var(--muted)">最大3体</small></h2>
  <p class="tag">戦闘中に交代できます。属性相性と技を組み合わせて攻略。</p>
  <div class="grid2">${S.owned.map(id=>{let x=partyStats(id),on=S.party.includes(id);return `<button class="mon ${on?"selected":""}" style="${on?"outline:2px solid var(--lime)":""}" onclick="toggleParty('${id}')"><div class="mini">${x.body}</div><b>${x.name}</b><br><small>${x.element} • ATK ${x.atk} • Lv.${x.lv}</small></button>`}).join("")}</div>
  <div class="notice" style="margin-top:10px">現在: ${S.party.map(id=>md(id).name).join(" / ")}</div>`;
  openM();
}
function toggleParty(id){
  ensureV3();
  if(S.party.includes(id)){if(S.party.length>1)S.party=S.party.filter(x=>x!==id)}
  else if(S.party.length<3)S.party.push(id);
  save();partyModal();
}

function v3Map(){
  let old=document.getElementById("nodes");
  if(!old)return;
  let types=[
    ["battle","⚔","BATTLE","Normal enemy"],
    ["elite","☠","ELITE","High reward"],
    ["treasure","✦","TREASURE","Relic / gear"],
    ["recruit","◉","HUNT","Capture chance"],
    ["event","?","MYSTERY","Random event"],
    ["rest","♥","CAMP","Recover party"]
  ];
  let picks=[];
  while(picks.length<3){let q=types[Math.floor(Math.random()*types.length)];if(!picks.includes(q))picks.push(q)}
  if(run.floor%5===0)picks=[types[1],types[3],types[4]];
  old.innerHTML=picks.map(t=>`<button class="node" onclick="v3Node('${t[0]}')"><div class="ico">${t[1]}</div><b>${t[2]}</b><small>${t[3]}</small></button>`).join("");
}
function v3Node(t){
  if(t==="battle"){v3Battle(false,false);return}
  if(t==="elite"){v3Battle(true,false);return}
  if(t==="recruit"){v3Battle(false,true);return}
  if(t==="treasure"){v3Treasure();return}
  if(t==="rest"){run.hp=run.maxHp;next("♥ Party fully recovered.");return}
  event();
}

function v3Battle(elite,recruit){
  ensureV3();
  let q=enemy(elite);
  q.element=v3Element(q.id);
  B={e:q,recruit,boss:false,activeIndex:0,partyHP:S.party.map(id=>partyStats(id).hp),turn:1};
  document.getElementById("battleLog").innerHTML=`<div>⚡ Your party: ${S.party.map(id=>md(id).name).join(" / ")}</div>`;
  v3DrawBattle();show("battle");
}
function currentFighter(){
  let id=S.party[B.activeIndex];return {id,x:partyStats(id),hp:B.partyHP[B.activeIndex]};
}
function v3DrawBattle(){
  let f=currentFighter(),e=B.e;
  document.getElementById("battleTitle").textContent=`FLOOR ${run.floor} • ${B.boss?"BOSS":B.recruit?"RECRUIT":e.elite?"ELITE":"BATTLE"}`;
  document.getElementById("enemyName").textContent=`${e.name} • ${e.element}`;
  document.getElementById("enemyVisual").innerHTML=`<span class="body">${e.body}</span><span class="mark">${V3.colors[e.element]||"✦"}</span>`;
  document.getElementById("enemyHP").style.width=Math.max(0,e.hp/e.maxHp*100)+"%";
  document.getElementById("enemyHPText").textContent=`HP ${Math.max(0,Math.ceil(e.hp))}/${Math.ceil(e.maxHp)}`;
  document.getElementById("intent").textContent=`${e.element} • ATK ${e.atk}`;
  document.getElementById("playerVisual").innerHTML=vis(f.id);
  document.getElementById("playerName").textContent=`${f.x.name} • ${f.x.element}`;
  document.getElementById("playerHP").style.width=Math.max(0,f.hp/f.x.hp*100)+"%";
  document.getElementById("playerHPText").textContent=`HP ${Math.max(0,Math.ceil(f.hp))}/${f.x.hp}`;
  document.getElementById("battleXP").textContent=`Lv.${f.x.lv}`;
  document.getElementById("captureBtn").disabled=e.hp>e.maxHp*.45;
  let old=document.getElementById("battleLog");
  if(!document.getElementById("switchParty")){
    let sw=document.createElement("button");sw.id="switchParty";sw.className="btn";sw.style.cssText="width:100%;margin-top:8px";sw.textContent="🔄 SWITCH MONSTER";sw.onclick=v3Switch;
    old.parentNode.insertBefore(sw,old);
  }
}
function v3Attack(mult=1,skillName="ATTACK"){
  let f=currentFighter(),e=B.e;
  let effectiveness=v3Mult(f.x.element,e.element);
  let crit=Math.random()<.08+(S.relics.includes("Lucky Fang")?.08:0);
  let d=Math.max(1,Math.round((f.x.atk*mult+(crit?f.x.atk*.7:0)-e.def)*effectiveness));
  e.hp-=d;
  let eff=effectiveness>1.1?" SUPER EFFECTIVE!":effectiveness<.9?" Not very effective.":"";
  log(`${crit?"💥 CRITICAL! ":""}${skillName} → ${d} damage.${eff}`);
  if(e.hp<=0){v3Win();return}
  setTimeout(v3EnemyTurn,160);v3DrawBattle();
}
function v3EnemyTurn(){
  let f=currentFighter(),d=Math.max(1,Math.round(B.e.atk-f.x.def));
  B.partyHP[B.activeIndex]-=d;log(`💥 ${f.x.name} took ${d}.`);
  if(B.partyHP[B.activeIndex]<=0){
    B.partyHP[B.activeIndex]=0;
    let next=B.partyHP.findIndex((h,i)=>h>0);
    if(next>=0){B.activeIndex=next;log(`🔄 ${md(S.party[next]).name} enters!`)}
    else{dead();return}
  }
  v3DrawBattle();
}
function v3Win(){
  let reward=10+(B.e.elite?15:0)+(B.boss?30:0);
  run.gold+=reward;S.shards+=B.e.elite?4:1;
  gain( B.boss?35:B.e.elite?16:9 );
  if(B.boss){S.dungeon.bosses++;let q=REL[Math.floor(Math.random()*REL.length)];if(!S.relics.includes(q[0]))S.relics.push(q[0]);}
  log(`🏆 VICTORY +${reward} gold`);
  setTimeout(()=>next(B.boss?`👑 Boss defeated. ${B.e.name}`:`🏆 ${reward} gold acquired.`),500);
}
function v3Switch(){
  if(B.partyHP.filter(x=>x>0).length<=1)return;
  B.activeIndex=(B.activeIndex+1)%S.party.length;
  while(B.partyHP[B.activeIndex]<=0)B.activeIndex=(B.activeIndex+1)%S.party.length;
  log(`🔄 Switched to ${md(S.party[B.activeIndex]).name}`);
  v3DrawBattle();
}
function v3Treasure(){
  let roll=Math.random();
  if(roll<.55){
    let id=S.party[Math.floor(Math.random()*S.party.length)];
    S.inventory[id]=S.inventory[id]||{};
    let k=["atk","def","hp"][Math.floor(Math.random()*3)];
    S.inventory[id][k]=(S.inventory[id][k]||0)+(k==="hp"?5:2);
    next(`✦ Gear upgrade! ${md(id).name} gained +${k==="hp"?5:2} ${k.toUpperCase()}.`);
  }else{
    let q=REL[Math.floor(Math.random()*REL.length)];
    if(!S.relics.includes(q[0]))S.relics.push(q[0]);
    else S.shards+=7;
    render();next(`✦ Found ${q[0]}!`);
  }
}
function v3Capture(){
  let e=B.e;
  if(e.hp>e.maxHp*.45)return;
  let shiny=Math.random()<.035;
  let chance=.32+(1-e.hp/e.maxHp)*.43+(S.relics.includes("Ancient Bell")?.15:0);
  if(Math.random()<chance){
    if(!S.owned.includes(e.id)){S.owned.push(e.id);S.mons[e.id]={lv:1,xp:0,rare:shiny,custom:{acc:"",mark:"✦"}};if(shiny)S.dungeon.shiny++}
    else S.shards+=6;
    S.dungeon.captures++;run.captures++;render();setTimeout(()=>next(`◉ ${shiny?"SHINY ":""}${M[e.id].species} captured!`),450);
  }else{log("◉ Capture failed.");v3EnemyTurn()}
}
function v3Skill(index){
  let f=currentFighter(),s=getV3Skill(f.id,index);
  if(s[0]==="Bloom Heal"){B.partyHP[B.activeIndex]=Math.min(f.x.hp,B.partyHP[B.activeIndex]+Math.ceil(f.x.hp*.28));log("🌸 Bloom Heal restored HP.");setTimeout(v3EnemyTurn,160);v3DrawBattle();return}
  if(s[0]==="Fortify"){B.partyHP[B.activeIndex]=Math.min(f.x.hp,B.partyHP[B.activeIndex]+Math.ceil(f.x.hp*.12));log("🗿 Fortify restored a little HP.");setTimeout(v3EnemyTurn,160);v3DrawBattle();return}
  v3Attack(s[2],s[0]);
}
// Override controls for V3
window.attack=()=>v3Attack(1,"ATTACK");
window.skill=()=>v3Skill(0);
window.capture=()=>v3Capture();
window.escapeBattle=()=>{if(Math.random()<.72)next("↩ Escaped.");else{log("Couldn't escape.");v3EnemyTurn()}};
window.battle=v3Battle;
window.startBoss=()=>{let q=run.boss;B={e:{...q,hp:q.hp*1.55,maxHp:q.hp*1.55,atk:q.atk*1.25,name:q.name+" OVERLORD"},recruit:false,boss:true,activeIndex:0,partyHP:S.party.map(id=>partyStats(id).hp)};v3DrawBattle();show("battle")};
const oldMap=map;
window.map=function(){oldMap();v3Map();};
const oldStart=startRun;
window.startRun=function(){ensureV3();S.dungeon.runs=(S.dungeon.runs||0)+1;save();oldStart();v3Map();};
const oldNext=next;
window.next=function(msg){oldNext(msg);};
function v3Status(){
 ensureV3();
 let title=document.querySelector("#home .floor");
 if(title)title.textContent=`BEST RUN ${S.best} • RUNS ${S.dungeon.runs} • SHINY ${S.dungeon.shiny}`;
}
function v3Boot(){v3HomeButton();v3Status();render();}
v3Boot();
</script></body></html>
